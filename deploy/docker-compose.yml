services:
  backend:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/dmessanger}
      DATABASE_USER: ${DATABASE_USER:-dmessanger}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-dmessanger}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-dmessanger-attachments}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dmessanger}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dmessanger-secret}
      TURN_PUBLIC_URL: ${TURN_PUBLIC_URL:-turn:localhost:3478}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-change-me-access-secret}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-change-me-refresh-secret}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      SEED_USERS_ENABLED: ${SEED_USERS_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dmessanger}
      POSTGRES_USER: ${POSTGRES_USER:-dmessanger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmessanger}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dmessanger}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dmessanger-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dmessanger}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dmessanger-secret}
      S3_BUCKET: ${S3_BUCKET:-dmessanger-attachments}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${S3_BUCKET};
      mc anonymous set none local/$${S3_BUCKET};
      "

  coturn:
    image: coturn/coturn:4.6.2
    command:
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --user=${TURN_USER:-dmessanger}:${TURN_PASSWORD:-dmessanger-turn-secret}
      - --realm=${TURN_REALM:-dmessanger.local}
      - --no-cli
      - --no-tls
      - --no-dtls
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
