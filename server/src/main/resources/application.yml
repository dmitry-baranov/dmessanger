server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: dmessanger-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/dmessanger}
    username: ${DATABASE_USER:dmessanger}
    password: ${DATABASE_PASSWORD:dmessanger}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

dmessanger:
  security:
    access-token-secret: ${JWT_ACCESS_SECRET:dev-only-change-me-access-secret}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  seed:
    enabled: ${SEED_USERS_ENABLED:true}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:dmessanger-attachments}
    access-key: ${S3_ACCESS_KEY:dmessanger}
    secret-key: ${S3_SECRET_KEY:dmessanger-secret}
  turn:
    public-url: ${TURN_PUBLIC_URL:turn:localhost:3478}
